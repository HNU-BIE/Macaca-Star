# ==================== MRI Guidance & Path ====================
MRI-guided: True                                               # Whether to enable MRI-guided registration / synthesis
MRI_file: 'example/fMOST_PI/MRI/MRI_brain_bc_dn_.nii.gz'       # Path to the reference MRI image (.nii.gz)

# ==================== MRI Orientation & Alignment ====================
MRI_oc: True                                                   # Whether to perform orientation correction / origin centering on MRI
MRI_transpose: [2, 0, 1]                                       # Axis permutation order [dim0, dim1, dim2] to match coordinate system
MRI_flip: [0, 0, 1]                                            # Axis flipping flags [flip_x, flip_y, flip_z] (1: flip, 0: keep)

# ==================== Volume Cropping & Cleaning ====================
rm_background: 231                                             # Intensity threshold or slice index used to remove background / non-brain regions
rm_neck: 90                                                    # Slice cutoff or threshold used to remove neck tissue from the volume